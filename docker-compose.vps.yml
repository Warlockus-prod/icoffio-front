services:
  postgres:
    image: postgres:16-alpine
    container_name: icoffio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icoffio}
      POSTGRES_USER: ${POSTGRES_USER:-icoffio}
      # POSTGRES_PASSWORD has NO default — must be set in .env.production.
      # Compose stack will fail to start if it's missing; that's intentional
      # so an empty/forgotten env-file does NOT silently boot with a known weak password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icoffio} -d ${POSTGRES_DB:-icoffio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # v10.20.0: bound resource usage so a runaway query can't OOM-kill the host.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  icoffio-front:
    container_name: icoffio-front-app
    build:
      context: .
      dockerfile: Dockerfile
      # v10.20.11: NEXT_PUBLIC_* must reach `next build` (baked into the client
      # bundle). Values come from --env-file .env.production at compose time.
      args:
        NEXT_PUBLIC_VIDEO_PREROLL_ENABLED: ${NEXT_PUBLIC_VIDEO_PREROLL_ENABLED:-false}
        NEXT_PUBLIC_DSP_PREROLL_AD_TAG: ${NEXT_PUBLIC_DSP_PREROLL_AD_TAG:-}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind only to docker0 gateway used by nginx container (not public WAN IP).
      - "172.17.0.1:4200:4200"
    volumes:
      # Persist app-level server logs across container restarts/redeploys.
      - ./runtime-logs:/app/runtime-logs
      # Persist ad diagnostics scan logs
      - ./data/ad-diagnostics-logs:/app/data/ad-diagnostics-logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # v10.20.0: bound resource usage. Next.js process + caches typically sit at 400-600MB;
    # 1.5G ceiling leaves headroom for build-time/ISR spikes without risking host OOM.
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: "1.5"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
